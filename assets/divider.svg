<svg xmlns="http://www.w3.org/2000/svg" width="900" height="8" viewBox="0 0 900 8" role="img" aria-label="Animated divider" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Animated divider</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#131a33"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
<rect x="0" y="3" width="900" height="2" rx="1" fill="#ffffff" fill-opacity="0.12"/>
<rect x="-200" y="2" width="200" height="4" rx="2" fill="url(#g)"><animate attributeName="x" from="-200" to="900" dur="4.5s" repeatCount="indefinite"/></rect>
</svg>
